<text x="795.00" y="176.00" font-family="Noto Sans CJK SC,sans-serif" font-size="16" fill="#233247">Nano方向</text>
<text x="795.00" y="199.00" font-family="Noto Sans CJK SC,sans-serif" font-size="14" fill="#526477">USB向上；左J6、右J5；每排20针</text>
<text x="795.00" y="242.00" font-family="Noto Sans CJK SC,sans-serif" font-size="16" fill="#233247">Nano排针</text>
<text x="795.00" y="265.00" font-family="Noto Sans CJK SC,sans-serif" font-size="14" fill="#526477">2.54 mm 同排；20.32 mm 跨排</text>
<text x="795.00" y="308.00" font-family="Noto Sans CJK SC,sans-serif" font-size="16" fill="#233247">中置中心（排针阵列）</text>
<text x="795.00" y="331.00" font-family="Noto Sans CJK SC,sans-serif" font-size="14" fill="#526477">(146.995750, 109.740500) mm</text>
<text x="795.00" y="374.00" font-family="Noto Sans CJK SC,sans-serif" font-size="16" fill="#233247">Nano左上针 J6.1</text>
<text x="795.00" y="397.00" font-family="Noto Sans CJK SC,sans-serif" font-size="14" fill="#526477">(136.835750, 85.610500)</text>
<text x="795.00" y="440.00" font-family="Noto Sans CJK SC,sans-serif" font-size="16" fill="#233247">Nano右上针 J5.1</text>
<text x="795.00" y="463.00" font-family="Noto Sans CJK SC,sans-serif" font-size="14" fill="#526477">(157.155750, 85.610500)</text>
<text x="795.00" y="506.00" font-family="Noto Sans CJK SC,sans-serif" font-size="16" fill="#233247">内侧排针列间距</text>
<text x="795.00" y="529.00" font-family="Noto Sans CJK SC,sans-serif" font-size="14" fill="#526477">45.7335 mm；Nano板宽约22.554 mm</text>
<text x="795.00" y="572.00" font-family="Noto Sans CJK SC,sans-serif" font-size="16" fill="#233247">左右平面余量</text>
<text x="795.00" y="595.00" font-family="Noto Sans CJK SC,sans-serif" font-size="14" fill="#526477">各约11.58 / 11.60 mm，到排针中心线</text>
<text x="795.00" y="638.00" font-family="Noto Sans CJK SC,sans-serif" font-size="16" fill="#233247">SPI直连端点距离</text>
<text x="795.00" y="661.00" font-family="Noto Sans CJK SC,sans-serif" font-size="14" fill="#526477">约12.96–21.87 mm；不是实际布线长度</text>
<text x="795.00" y="704.00" font-family="Noto Sans CJK SC,sans-serif" font-size="16" fill="#233247">关键限制</text>
<text x="795.00" y="727.00" font-family="Noto Sans CJK SC,sans-serif" font-size="14" fill="#526477">Nano处于138K投影内，必须核Z间隙</text>
<text x="795.00" y="770.00" font-family="Noto Sans CJK SC,sans-serif" font-size="16" fill="#233247">安装候选</text>
<text x="795.00" y="793.00" font-family="Noto Sans CJK SC,sans-serif" font-size="14" fill="#526477">同面分层；若高度不够则背装并镜像针序</text>
<text x="795.00" y="836.00" font-family="Noto Sans CJK SC,sans-serif" font-size="16" fill="#233247">可调整</text>
<text x="795.00" y="859.00" font-family="Noto Sans CJK SC,sans-serif" font-size="14" fill="#526477">其他模块、安装孔、测试口、走线</text>
<text x="90.00" y="858.00" font-family="Noto Sans CJK SC,sans-serif" font-size="18" fill="#233247">同面分层的侧视示意（不按比例）</text>
