# Warm Pad: original preset for the current FPGA subtractive engine.
# License: MIT
# Seconds; amp sustain/volume in dB; cutoff in Hz at MIDI 60; resonance = Q.
# Module-level RTL audition verified; physical DAC/listening acceptance pending.
format = 1

[voice]
structure = "4+4"
osc_mix = -15
unison_detune = 0.035
unison_stereo = 65

[[osc]]
wave = "saw"
tune = 0
pulse_width = 50

[[osc]]
wave = "triangle"
tune = 0.0234375
pulse_width = 50

[filter]
type = "lowpass"
slope = 24
cutoff = 700
resonance = 0.70710678
key_track = 65

[amp_env]
attack = 0.65
sustain = -2.5
decay = 1.5
release = 1.8
velocity = 20

[mod_env]
attack = 1
sustain = 35
decay = 2.5
release = 1.8
velocity = 20
destination = "cutoff"
depth = 7

[[lfo]]
shape = "triangle"
rate = 5
destination = "pitch"
depth = 0

[[lfo]]
shape = "triangle"
rate = 0.18
destination = "cutoff"
depth = 0.8

[part]
volume = -6
pan = 0
bend_range = 2
wheel_vibrato_depth = 12
touch_cutoff_depth = 0.75
touch_resonance_depth = 10
