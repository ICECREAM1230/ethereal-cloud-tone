# Synth Lead: original preset for the current FPGA subtractive engine.
# License: MIT
# Seconds; amp sustain/volume in dB; cutoff in Hz at MIDI 60; resonance = Q.
# Module-level RTL audition verified; physical DAC/listening acceptance pending.
format = 1

[voice]
structure = "1+1"
osc_mix = -12
unison_detune = 0
unison_stereo = 0

[[osc]]
wave = "saw"
tune = 0
pulse_width = 50

[[osc]]
wave = "pulse"
tune = 0.046875
pulse_width = 42

[filter]
type = "lowpass"
slope = 24
cutoff = 1800
resonance = 0.95
key_track = 75

[amp_env]
attack = 0.004
sustain = -2
decay = 0.3
release = 0.18
velocity = 30

[mod_env]
attack = 0.004
sustain = 30
decay = 0.28
release = 0.18
velocity = 25
destination = "cutoff"
depth = 12

[[lfo]]
shape = "triangle"
rate = 5
destination = "pitch"
depth = 0.035

[[lfo]]
shape = "triangle"
rate = 0.3
destination = "cutoff"
depth = 0

[part]
volume = -3
pan = 0
bend_range = 2
wheel_vibrato_depth = 30
touch_cutoff_depth = 1.5
touch_resonance_depth = 15
